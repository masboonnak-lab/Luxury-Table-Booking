openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venue
    description: The room, its zones and its event calendar
  - name: orders
    description: Table bookings and event ticket orders
  - name: auth
    description: Guest accounts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /floor:
    get:
      operationId: getFloor
      tags: [venue]
      summary: Floor plan
      description: Every zone and bookable table in the room.
      responses:
        "200":
          description: The floor plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorPlan"

  /events:
    get:
      operationId: listEvents
      tags: [venue]
      summary: Ticketed events
      description: >
        Upcoming events with the number of tickets still available. The
        remaining count is derived from live orders, so it never disagrees with
        what a purchase will actually allow.
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueEvent"

  /availability:
    get:
      operationId: getAvailability
      tags: [venue]
      summary: Table availability for a date and slot
      description: >
        A table is unavailable when a paid order holds it, or when an unpaid
        order still holds it inside its payment window. `selectable` also
        applies the party-size fit when `guests` is supplied.
      parameters:
        - name: date
          in: query
          required: true
          description: Service date, yyyy-MM-dd
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: slot
          in: query
          required: false
          description: Seating slot, HH:mm. Defaults to the venue's main seating.
          schema:
            $ref: "#/components/schemas/Slot"
        - name: guests
          in: query
          required: false
          description: Party size, used to compute `selectable`.
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"

  /bookings:
    post:
      operationId: createBooking
      tags: [orders]
      summary: Hold a table
      description: >
        Creates a pending order that holds the table for the payment window.
        The deposit is priced on the server from the zone's minimum spend and
        the party size — the client never sends an amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Table held, awaiting payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ticket-orders:
    post:
      operationId: createTicketOrder
      tags: [orders]
      summary: Hold event tickets
      description: >
        Creates a pending order that holds the tickets for the payment window.
        The total is priced on the server from the event's ticket price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketOrderRequest"
      responses:
        "201":
          description: Tickets held, awaiting payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: Orders for a phone number
      description: Backs the "My tickets" screen. Newest first.
      parameters:
        - name: phone
          in: query
          required: true
          description: Thai mobile number; punctuation is ignored.
          schema:
            type: string
            minLength: 9
            maxLength: 20
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderKind"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

  /orders/{code}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: One order by its reference
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{code}/slip:
    post:
      operationId: submitSlip
      tags: [orders]
      summary: Submit a transfer slip
      description: >
        Records the SHA-256 of the uploaded slip and marks the order paid. A
        hash that has already been spent is rejected with 409 — the uniqueness
        is enforced by the database, not by the caller.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSlipRequest"
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlipResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The payment window closed and the hold was released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{code}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      description: >
        Releases the held table or tickets. The booking phone number must match
        — the reference alone is not treated as proof of ownership.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The phone number does not match the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: >
        Creates the account and signs it in — the response sets an httpOnly
        session cookie. PDPA consent is required, and the time it was given is
        recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Revokes the current session. Safe to call when signed out.
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in account
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Change your own name or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your own password
      description: >
        Every other session is revoked, so a password changed because it leaked
        actually locks the other party out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/orders:
    get:
      operationId: listMyOrders
      tags: [auth]
      summary: Your own bookings and tickets
      description: >
        Backs "My tickets" for a signed-in member. Matches on the account's
        phone number, so bookings made before signing up still appear.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderKind"
      responses:
        "200":
          description: Orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  responses:
    Unauthorized:
      description: Not signed in, or the credentials were wrong
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: The request was rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      description: Every non-2xx response in this API has this shape.
      properties:
        error:
          type: string
          description: Stable machine-readable code, e.g. `table_taken`.
        message:
          type: string
          description: Human-readable Thai text, safe to show to a guest.
      required:
        - error
        - message

    Slot:
      type: string
      description: Seating slot, HH:mm.
      enum:
        - "18:00"
        - "19:00"
        - "20:00"
        - "21:00"
        - "22:00"
        - "23:00"

    TableShape:
      type: string
      enum: [round, rect]

    OrderKind:
      type: string
      enum: [table, ticket]

    OrderStatus:
      type: string
      enum: [pending, paid, cancelled, expired]

    Zone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        minSpend:
          type: number
          description: Minimum spend in THB. 0 means none.
        capacityMin:
          type: integer
        capacityMax:
          type: integer
      required:
        - id
        - name
        - description
        - minSpend
        - capacityMin
        - capacityMax

    FloorTable:
      type: object
      properties:
        id:
          type: string
        zoneId:
          type: string
        shape:
          $ref: "#/components/schemas/TableShape"
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        minSeats:
          type: integer
        maxSeats:
          type: integer
      required:
        - id
        - zoneId
        - shape
        - x
        - y
        - w
        - h
        - minSeats
        - maxSeats

    FloorPlan:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/FloorTable"
      required:
        - zones
        - tables

    VenueEvent:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [concert, dj, festival, special]
        title:
          type: string
        artistTh:
          type: string
        artistEn:
          type: string
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        doorsAt:
          type: string
        price:
          type: number
          description: Price per ticket in THB.
        capacity:
          type: integer
        ticketsLeft:
          type: integer
      required:
        - id
        - kind
        - title
        - artistTh
        - artistEn
        - date
        - doorsAt
        - price
        - capacity
        - ticketsLeft

    TableAvailability:
      type: object
      properties:
        id:
          type: string
        free:
          type: boolean
        selectable:
          type: boolean
          description: Free *and* the party fits, when `guests` was supplied.
      required:
        - id
        - free
        - selectable

    Availability:
      type: object
      properties:
        date:
          type: string
        slot:
          $ref: "#/components/schemas/Slot"
        freeTables:
          type: integer
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableAvailability"
      required:
        - date
        - slot
        - freeTables
        - tables

    Order:
      type: object
      description: >
        One shape for both kinds. `guests`/`tableId`/`zoneId`/`zoneName` are
        present only for table bookings; `eventId`/`eventTitle`/`quantity` only
        for ticket orders.
      properties:
        code:
          type: string
        kind:
          $ref: "#/components/schemas/OrderKind"
        status:
          $ref: "#/components/schemas/OrderStatus"
        bookerName:
          type: string
        phone:
          type: string
        email:
          type: string
        occasion:
          type: string
        notes:
          type: string
        date:
          type: string
        slot:
          type: string
        holdUntil:
          type: string
        guests:
          type: integer
        tableId:
          type: string
        zoneId:
          type: string
        zoneName:
          type: string
        eventId:
          type: string
        eventTitle:
          type: string
        quantity:
          type: integer
        amount:
          type: number
          description: What the guest pays, VAT included, in THB.
        amountBase:
          type: number
          description: VAT-exclusive portion of `amount`.
        amountVat:
          type: number
        holdExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
      required:
        - code
        - kind
        - status
        - bookerName
        - phone
        - date
        - slot
        - holdUntil
        - amount
        - amountBase
        - amountVat
        - holdExpiresAt
        - createdAt

    CreateBookingRequest:
      type: object
      properties:
        bookerName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 9
          maxLength: 20
        email:
          type: string
        guests:
          type: integer
          minimum: 1
          maximum: 20
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        slot:
          $ref: "#/components/schemas/Slot"
        tableId:
          type: string
        holdUntil:
          type: string
          pattern: "^\\d{2}:\\d{2}$"
        occasion:
          type: string
          maxLength: 60
        notes:
          type: string
          maxLength: 500
      required:
        - bookerName
        - phone
        - guests
        - date
        - tableId

    CreateTicketOrderRequest:
      type: object
      properties:
        bookerName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 9
          maxLength: 20
        email:
          type: string
        eventId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 500
      required:
        - bookerName
        - phone
        - eventId
        - quantity

    SubmitSlipRequest:
      type: object
      properties:
        hash:
          type: string
          description: Lowercase hex SHA-256 of the slip image.
          pattern: "^[0-9a-f]{64}$"
        fileName:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 5242880
      required:
        - hash
        - fileName
        - sizeBytes

    SlipResult:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        slipStatus:
          type: string
          enum: [pending_bank_check, verified, rejected]
        pendingBankCheck:
          type: boolean
          description: >
            True until a slip-verification provider is wired up. The duplicate
            check is real; authenticity is not yet checked.
      required:
        - order
        - slipStatus
        - pendingBankCheck

    CancelOrderRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
      required:
        - phone

    UserRole:
      type: string
      enum: [member, admin]

    AuthUser:
      type: object
      description: Never carries the password hash or the session token.
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        suspended:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - email
        - role
        - suspended
        - createdAt

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 9
          maxLength: 20
        email:
          # A pattern, not `format: email`: Orval renders that as zod.email(),
          # which is zod v4 syntax and this workspace is on v3.
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$"
          minLength: 5
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200
        pdpaConsent:
          type: boolean
          description: Must be true. The server records when it was given.
      required:
        - name
        - phone
        - email
        - password
        - pdpaConsent

    UpdateProfileRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          # A pattern, not `format: email`: Orval renders that as zod.email(),
          # which is zod v4 syntax and this workspace is on v3.
          type: string
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$"
          minLength: 5
          maxLength: 254

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
      required:
        - currentPassword
        - newPassword

    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - phone
        - password
