name: Deploy landing page

# Every push to main is a candidate deploy, but nothing ships unless the
# checks pass first — a broken build must never replace a working site.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight deploy pointless; cancel it rather than
# racing two uploads to the same route.
concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        # corepack ships with Node, so no third-party action is needed here.
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Booking logic checks
        run: pnpm --filter @workspace/api-server run check:booking

      - name: Build landing page
        run: pnpm --filter @workspace/mockup-sandbox run build:club

      - name: Check Cloudflare credentials
        id: creds
        # Without the secret this job cannot deploy, but the local post-commit
        # hook already publishes from the dev machine — so warn loudly and let
        # the checks above still count, rather than failing every push.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret — skipping deploy. Checks passed. Add the secret under Settings > Secrets and variables > Actions (create it at dash.cloudflare.com with the 'Edit Cloudflare Workers' template) to deploy from CI."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 deploy --config artifacts/mockup-sandbox/wrangler.jsonc

      - name: Verify the site is live
        # Runs even when this job did not deploy: the local hook may have, and
        # a landing page that stopped answering is worth knowing about either way.
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://sovereign-os.online/entertainment/club/)
            if [ "$code" = "200" ]; then
              echo "live (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying"
            sleep 10
          done
          echo "::error::The landing page did not return 200"
          exit 1
